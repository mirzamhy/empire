<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMPIRE · Kodeks Pasukan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1a22;
      --panel: #13242f;
      --panel-2: #182d3a;
      --line: #24404f;
      --text: #e8e2d0;
      --mute: #8fa3ad;
      --gold: #f2c14e;
      --red: #e5484d;
      --hp: #4ade80;
      --dmg: #f97316;
      --range: #38bdf8;
      --speed: #c084fc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
    a { color: var(--gold); }
    header { padding: 28px 24px 8px; max-width: 1280px; margin: 0 auto; }
    h1 { font-family: Cinzel, serif; font-weight: 900; letter-spacing: 0.06em; margin: 0; font-size: 30px; color: var(--gold); }
    header p { margin: 6px 0 0; color: var(--mute); max-width: 720px; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 16px; }
    .controls label { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--bg) inset; }
    .level { display: flex; align-items: center; gap: 10px; }
    .level input { width: 160px; accent-color: var(--gold); }
    .level output { font-family: Cinzel, serif; font-weight: 800; color: var(--gold); min-width: 46px; }

    main { max-width: 1280px; margin: 0 auto; padding: 16px 24px 48px; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; align-items: start; }
    .detail { position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .stage { position: relative; height: 320px; background: radial-gradient(ellipse at 50% 70%, #26495c 0%, #14262f 70%); cursor: grab; touch-action: none; }
    .stage:active { cursor: grabbing; }
    .stage canvas { width: 100%; height: 100%; display: block; }
    .stage .hint { position: absolute; bottom: 8px; right: 12px; font-size: 11px; color: var(--mute); }
    .detail-body { padding: 16px 18px 20px; }
    .detail h2 { font-family: Cinzel, serif; font-size: 24px; margin: 0; display: flex; align-items: center; gap: 10px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
    .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--mute); }
    .tag.tier-Ringan { color: #a7f3d0; border-color: #2f6b55; }
    .tag.tier-Menengah { color: #bfdbfe; border-color: #2c5282; }
    .tag.tier-Berat { color: #fed7aa; border-color: #8a4b1c; }
    .tag.tier-Legendaris { color: #fde68a; border-color: #8a6d1c; background: #2a2412; }
    .stats { display: grid; gap: 8px; margin: 4px 0 14px; }
    .stat { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; }
    .stat .name { color: var(--mute); }
    .stat .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bar { height: 8px; background: #0b1820; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 99px; }
    h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin: 14px 0 6px; }
    ul.list { margin: 0; padding-left: 18px; }
    ul.list li { margin: 2px 0; }
    .desc { color: var(--mute); font-size: 13px; margin: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color 0.15s, transform 0.15s; }
    .card:hover { border-color: #3d6478; transform: translateY(-2px); }
    .card[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .card canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: radial-gradient(ellipse at 50% 70%, #23404f 0%, #13232c 75%); }
    .card .title { font-family: Cinzel, serif; font-weight: 800; margin: 8px 0 2px; font-size: 15px; }
    .card .sub { font-size: 12px; color: var(--mute); }
    .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; font-size: 11px; text-align: center; }
    .mini b { display: block; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
    .mini span { color: var(--mute); }

    section.table { max-width: 1280px; margin: 0 auto; padding: 0 24px 56px; }
    section.table h2 { font-family: Cinzel, serif; margin: 0 0 10px; font-size: 20px; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
    th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: var(--panel-2); color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; user-select: none; white-space: nowrap; }
    th[aria-sort="descending"]::after { content: " ▼"; color: var(--gold); }
    th[aria-sort="ascending"]::after { content: " ▲"; color: var(--gold); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #172b37; }
    tbody tr.sel { background: #1d3341; }
    .foot { color: var(--mute); font-size: 12px; margin-top: 10px; }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; padding: 12px 16px 32px; }
      header, section.table { padding-left: 16px; padding-right: 16px; }
      .detail { position: static; }
      .stage { height: 260px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>KODEKS PASUKAN</h1>
    <p>Semua jenis pasukan EMPIRE: stat, kemampuan, dan cara mendapatkannya. Angka diambil langsung dari <code>config/game.config.json</code> dan <code>config/events.config.json</code>.</p>
    <div class="controls">
      <div><label>Warna kerajaan</label><div class="swatches" id="swatches"></div></div>
      <div><label for="level">Level kastil</label><div class="level"><input id="level" type="range" min="1" max="10" value="1" /><output id="levelOut">Lv 1</output></div></div>
    </div>
  </header>
  <main>
    <aside class="detail" id="detail">
      <div class="stage" id="stage"><span class="hint">seret untuk memutar</span></div>
      <div class="detail-body" id="detailBody"></div>
    </aside>
    <div class="grid" id="grid"></div>
  </main>
  <section class="table">
    <h2>Perbandingan</h2>
    <div class="scroll"><table id="table"></table></div>
    <p class="foot" id="foot"></p>
  </section>
  <script type="module" src="/src/codex.ts"></script>
</body>
</html>
